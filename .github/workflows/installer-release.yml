name: Installer release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-alpha.*"
      - "v*-beta.*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build and verify shared release inputs
        run: |
          pnpm installer:bundle
          pnpm installer:metadata
          pnpm installer:verify
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: opap-release-inputs
          if-no-files-found: error
          path: |
            apps/installer/resources/opap-deployment-bundle.tgz
            apps/installer/resources/opap-installer.cdx.json
            apps/installer/resources/opap-deployment-bundle.cdx.json
            apps/installer/resources/release.json
            apps/installer/resources/SHA256SUMS

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: win, arch: x64 }
          - { name: linux-x64, os: ubuntu-latest, target: linux, arch: x64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: linux, arch: arm64 }
          - { name: macos-arm64, os: macos-14, target: mac, arch: arm64 }
    runs-on: ${{ matrix.os }}
    env:
      HAS_WINDOWS_SIGNING: ${{ secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' }}
      HAS_MAC_SIGNING: ${{ secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: opap-release-inputs
          path: apps/installer/resources
      - run: pnpm installer:runtime
      - run: pnpm --filter @opap/installer build
      - name: Package signed Windows installer
        if: matrix.target == 'win' && env.HAS_WINDOWS_SIGNING == 'true'
        run: |
          pnpm installer:signing-status windows signed
          pnpm --filter @opap/installer exec electron-builder --win --${{ matrix.arch }} --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Package unsigned Windows installer
        if: matrix.target == 'win' && env.HAS_WINDOWS_SIGNING != 'true'
        run: |
          pnpm installer:signing-status windows unsigned
          pnpm --filter @opap/installer exec electron-builder --win --${{ matrix.arch }} --publish never
      - name: Package signed and notarized macOS installer
        if: matrix.target == 'mac' && env.HAS_MAC_SIGNING == 'true'
        run: |
          pnpm installer:signing-status macos signed
          pnpm --filter @opap/installer exec electron-builder --mac --${{ matrix.arch }} --publish never -c.mac.hardenedRuntime=true -c.mac.notarize=true
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Package unsigned macOS development installer
        if: matrix.target == 'mac' && env.HAS_MAC_SIGNING != 'true'
        run: |
          pnpm installer:signing-status macos unsigned
          pnpm --filter @opap/installer exec electron-builder --mac --${{ matrix.arch }} --publish never -c.mac.identity=null -c.mac.hardenedRuntime=false -c.mac.notarize=false
      - name: Package Linux installer
        if: matrix.target == 'linux'
        run: |
          pnpm installer:signing-status linux unsigned
          pnpm --filter @opap/installer exec electron-builder --linux --${{ matrix.arch }} --publish never
      - run: pnpm installer:finalize
      - name: Verify embedded release inputs
        run: pnpm installer:verify
      - name: Verify packaged release artifacts
        run: pnpm installer:verify apps/installer/release/SHA256SUMS
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          # subject-checksums misparses LF-only files on Windows runners.
          # Match only completed root files so unpacked application directories
          # are never included as attestation subjects.
          subject-path: |
            apps/installer/release/*.*
            apps/installer/release/SHA256SUMS
      - uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
        with:
          subject-path: apps/installer/resources/opap-deployment-bundle.tgz
          sbom-path: apps/installer/resources/opap-deployment-bundle.cdx.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: opap-setup-${{ matrix.name }}
          if-no-files-found: error
          path: apps/installer/release/*.*

  publish:
    name: Publish GitHub prerelease
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download verified build artifacts
        run: gh run download "$GITHUB_RUN_ID" --dir downloaded
      - name: Assemble public release assets
        shell: bash
        run: |
          set -euo pipefail
          require_one() {
            local root="$1"
            local pattern="$2"
            mapfile -t matches < <(find "$root" -type f -name "$pattern" -print)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              printf 'Expected exactly one %s in %s, found %s\n' "$pattern" "$root" "${#matches[@]}" >&2
              exit 1
            fi
            printf '%s' "${matches[0]}"
          }
          mkdir release-assets
          cp "$(require_one downloaded/opap-setup-windows-x64 '*Setup Setup*.exe')" release-assets/opap-setup-windows-x64.exe
          cp "$(require_one downloaded/opap-setup-linux-x64 '*.AppImage')" release-assets/opap-setup-linux-x64.AppImage
          cp "$(require_one downloaded/opap-setup-linux-arm64 '*.AppImage')" release-assets/opap-setup-linux-arm64.AppImage
          for file in opap-deployment-bundle.tgz opap-source.tar.gz opap-installer.cdx.json opap-deployment-bundle.cdx.json provenance.json release.json verify.ps1 verify.sh; do
            cp "$(require_one downloaded/opap-setup-windows-x64 "$file")" "release-assets/$file"
          done
          cd release-assets
          sha256sum * > SHA256SUMS
      - name: Publish beta release
        shell: bash
        run: |
          set -euo pipefail
          notes_ja="docs/ja/releases/${GITHUB_REF_NAME}.md"
          notes_en="docs/en/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes_ja"
          test -f "$notes_en"
          {
            cat "$notes_ja"
            printf '\n---\n\n'
            cat "$notes_en"
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "Open Personal Agent Platform $GITHUB_REF_NAME" \
            --notes-file release-notes.md
